name: Build Cinema Player APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip -q CinemaPlayer.zip -d project

      - name: Build APK
        run: gradle -p project/CinemaPlayer assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CinemaPlayer-APK
          path: project/CinemaPlayer/app/build/outputs/apk/debug/*.apk
